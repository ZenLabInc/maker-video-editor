[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maker-video-editor"
version = "0.1.0"
description = "Offline, plan-driven dual-camera video editing with FFmpeg"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asr = ["mlx-whisper>=0.4,<0.5"]
vad = ["silero-vad>=6,<7"]

[project.scripts]
maker-video = "maker_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
